<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelojesOscar</title>
    <!-- Librería XLSX principal (cdnjs - más compatible) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Respaldo automático por si el navegador bloquea la primera -->
    <script>
        if (typeof XLSX === 'undefined') {
            var backupScript = document.createElement('script');
            backupScript.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
            document.head.appendChild(backupScript);
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        
        #debug-box {
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: #222;
            color: #0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        
        .card-image-wrapper {
            display: block;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background-color: #f9f9f9; 
            transition: transform 0.2s;
        }
        
        .card-image-wrapper:hover img {
            transform: scale(1.05);
        }

        .price { font-weight: bold; color: #27ae60; font-size: 1.2em; margin: 10px 0; }
        .btn-whatsapp { display: inline-block; background: #25d366; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .btn-whatsapp:hover { background: #20ba5a; }

        /* VENTANA FLOTANTE (MODAL) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>RelojesOscar</h1>
    <p class="subtitle">Toca cualquier imagen para ampliarla. Toca "Consultar por WhatsApp" para enviar el modelo y la foto.</p>

    <!-- CAJA DE DIAGNÓSTICO -->
    <div id="debug-box">Iniciando sistema...</div>

    <div class="grid" id="catalogo-productos"></div>

    <!-- MODAL -->
    <div id="imageModal" class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Imagen ampliada">
    </div>

    <script>
        const debugBox = document.getElementById("debug-box");
        function log(mensaje) {
            console.log(mensaje);
            debugBox.innerText += "\n> " + mensaje;
        }

        // Damos un pequeño respiro para que el respaldo cargue si hizo falta
        setTimeout(() => {
            log("Verificando librería XLSX...");
            if (typeof XLSX === 'undefined') {
                log("❌ ERROR CRÍTICO: La librería XLSX sigue bloqueada. Revisa tu AdBlock.");
                return;
            } else {
                log("✔️ Librería XLSX cargada correctamente.");
            }

            const numeroWhatsApp = "5491159828985";
            const contenedor = document.getElementById("catalogo-productos");
            
            log("Intentando descargar 'Descripcion.xlsx'...");
            
            fetch('./Descripcion.xlsx')
                .then(response => {
                    log("Respuesta del servidor recibida. Status: " + response.status);
                    if (!response.ok) {
                        throw new Error("No se encontró el archivo 'Descripcion.xlsx' (Código HTTP: " + response.status + ")");
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    log("✔️ Archivo descargado con éxito. Procesando Excel...");
                    const workbook = XLSX.read(data, { type: 'array' });
                    log("Hojas encontradas: " + workbook.SheetNames.join(", "));
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const productos = XLSX.utils.sheet_to_json(worksheet);
                    log("✔️ Productos leídos: " + productos.length);

                    if (productos.length === 0) {
                        log("⚠️ El Excel está vacío o las columnas no tienen formato de tabla.");
                        return;
                    }

                    // Ocultamos la caja de consola de diagnóstico porque todo salió bien
                    debugBox.style.display = "none";

                    productos.forEach((prod) => {
                        const imagen = prod.imagen ? String(prod.imagen).trim() : '';
                        const nombre = prod.nombre ? String(prod.nombre).trim() : 'Producto';
                        let precio = prod.precio !== undefined ? prod.precio : 'Consultar';
                        
                        if (typeof precio === 'number') {
                            precio = '$' + precio.toLocaleString('es-AR');
                        } else {
                            precio = '$' + precio;
                        }

                        const descripcion = prod.descripcion ? String(prod.descripcion).trim() : '';
                        const urlFoto = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + `img/${imagen}`;
                        const textoMensaje = encodeURIComponent(`Hola, me interesa el producto: ${nombre} (${precio}). Vi esta foto: ${urlFoto}`);

                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="card-image-wrapper" onclick="abrirModal('img/${imagen}')" title="Ampliar imagen">
                                <img src="img/${imagen}" alt="${nombre}" onerror="this.src='https://via.placeholder.com/200?text=Error+Imagen'">
                            </div>
                            <h3>${nombre}</h3>
                            <div class="price">${precio}</div>
                            <p>${descripcion}</p>
                            <a href="https://wa.me/${numeroWhatsApp}?text=${textoMensaje}" class="btn-whatsapp" target="_blank">Consultar por WhatsApp</a>
                        `;
                        contenedor.appendChild(card);
                    });
                })
                .catch(error => {
                    log("❌ ERROR CAPTURADO: " + error.message);
                    console.error(error);
                });
        }, 300);

        // Lógica del Modal
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const closeModal = document.getElementById("closeModal");

        function abrirModal(rutaImagen) {
            modal.style.display = "flex";
            modalImg.src = rutaImagen;
        }

        closeModal.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
